name: AzmyAI
options:
  bundleIdPrefix: ai.azmy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  AzmyAI:
    type: application
    platform: iOS
    sources:
      - path: AzmyAI
        excludes:
          - "**/*.xcassets"
      - path: AzmyAI/Resources/Assets.xcassets
    resources:
      - path: AzmyAI/Resources/Assets.xcassets
      - path: AzmyAI/Info.plist
    settings:
      base:
        INFOPLIST_FILE: AzmyAI/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: ai.azmy.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
    entitlements:
      path: AzmyAI/AzmyAI.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access:
          - health-records
        com.apple.security.application-groups:
          - group.ai.azmy.app

schemes:
  AzmyAI:
    build:
      targets:
        AzmyAI: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
